<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form tags</title>
</head>
<body>
    <form>
        <label>User name</label><br/>
        <input type="text" placeholder="enter your username" required><br/>
        <label>Email</label><br/>
        <input type="email" placeholder="enter your email" required><br/>
        <label>Mobile No.</label><br/>
        <input type="text" placeholder="enter your mobile number" required><br/>
        <label>Password</label><br/>
        <input type="password" placeholder="enter your password" required><br/><br/>
        <input type="checkbox">HTML<br/><br/>
        <input type="radio" name="gender" value="Male">Male<br/>
        <input type="radio" name="gender" value="Female">Female<br/>
        <input type="radio" name="gender" value="Other">prefer not to say<br/><br/>
        <select>
            <option value="1">Apple</option>
            <option value="2">Banana</option>
            <option value="3">Cranberry</option>
            <option value="4">Dragon fruit</option>
        </select><br/><br/>
        <textarea placeholder="any additional comments" rows="10" cols="100"></textarea><br/><br/>    
        <button>Submit </button><br/><br/>
    </form>
    <center>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </center>
    <hr>
    <div>
        <h1>Front end</h1>
        <button>Login</button>
    </div>
    <header></header>
    <section></section>
    <aside></aside>
    <footer></footer>
</body>
</html>
