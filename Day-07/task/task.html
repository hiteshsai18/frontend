<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easter Day</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.top-banner {
    height: 250px;
    background: url("easterbackground.jpg") no-repeat center;
    background-size: cover;
}
body {
    background-image: url(longback.jpg);
}
.gallery {
    padding: 40px 0;
}

.gallery img {
    aspect-ratio: 1/1;
    width: 35%;
    border-radius: 10px;
    transition: transform 0.3s;
}
.gallery img:hover{
    transform: scale(1.2);
}
button{
    justify-content: center;

}

</style>
</head>

<body>

<div class="top-banner"></div>


<div class="container gallery">
    <div class="row text-center g-4">

        <div class="col-12 col-sm-6 col-md-6">
            <img src="decos.jpg" class="img-fluid">
        </div>

        <div class="col-12 col-sm-6 col-md-6">
            <img src="easterbunny.jpg" class="img-fluid">
        </div>

        <div class="col-12 col-sm-6 col-md-6">
            <img src="basket.jpg" class="img-fluid">
        </div>

        <div class="col-12 col-sm-6 col-md-6">
            <img src="chocobunny.jpg" class="img-fluid">
        </div>
    </div>
    <div class="text-center">
        <button class="btn btn-primary">Be blessed with grace</button>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
