<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="smalltask.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSxggIt5CPQqUxKi3eW4QhNIKv5eH5LdhRwMA&s" width="40px">
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
      <img src="https://static.thenounproject.com/png/683452-200.png" width="40px">
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">About</a></li>
      </ul>

      <form class="d-flex">
        <input class="form-control me-2" type="search" placeholder="Search">
        <button class="btn btn-outline-light">Search</button>
      </form>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <form class="needs-validation" novalidate>

        <div class="mb-3">
          <label class="form-label">First name</label>
          <input type="text" class="form-control" required>
          <div class="invalid-feedback">Enter first name</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Last name</label>
          <input type="text" class="form-control" required>
          <div class="invalid-feedback">Enter last name</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" required>
          <div class="invalid-feedback">Enter username</div>
        </div>

        <div class="mb-3">
          <label class="form-label">City</label>
          <input type="text" class="form-control" required>
          <div class="invalid-feedback">Enter city</div>
        </div>

        <div class="mb-3">
          <label class="form-label">State</label>
          <select class="form-select" required>
            <option value="">Choose...</option>
            <option>Andhra Pradesh</option>
            <option>Telangana</option>
          </select>
          <div class="invalid-feedback">Select state</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Zip</label>
          <input type="text" class="form-control" required>
          <div class="invalid-feedback">Enter zip</div>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" required>
          <label class="form-check-label">Agree to terms</label>
          <div class="invalid-feedback">You must agree</div>
        </div>

        <button class="btn btn-primary w-100" type="submit">Submit</button>

      </form>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
(() => {
  'use strict';
  const forms = document.querySelectorAll('.needs-validation');

  Array.from(forms).forEach(form => {
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault();
        event.stopPropagation();
        alert("Please fill all required fields");
      }
      form.classList.add('was-validated');
    });
  });
})();
</script>

</body>
</html>
